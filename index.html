<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd.io Competitive Leaderboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: #ffca28; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 25px; }
        .tab-btn { background: #232329; color: #ccc; border: 1px solid #3e3e4a; padding: 10px 18px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s ease; }
        .tab-btn:hover { background: #2d2d35; border-color: #5a5a6e; }
        .tab-btn.active { background: #ffca28; color: #121214; border-color: #ffca28; }
        table { width: 100%; border-collapse: collapse; background: #1c1c22; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid #2d2d38; }
        th { background-color: #272730; color: #ffca28; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        tr:hover { background-color: #25252e; }
        .tier-badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; display: inline-block; letter-spacing: 0.5px; }
        .lt { background: #4caf50; color: #fff; }
        .ht { background: #f44336; color: #fff; }
        .cps-val { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bloxd.io Competitive Leaderboard</h1>
        <div class="subtitle">Official HT1 to LT5 Player Standings & CPS Tracker</div>
        
        <div class="tabs" id="modeTabs"></div>
        
        <table id="leaderboardTable">
            <thead>
                <tr>
                    <th style="width: 10%;">Rank</th>
                    <th style="width: 50%;">Player Name</th>
                    <th style="width: 20%;">Tier</th>
                    <th style="width: 20%;">Max CPS</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>

    <script>
        // MASTER DATABASE: Add new players, rivals, or updates here!
        // sort values guide: HT1=10, LT1=9, HT2=8, LT2=7, HT3=6, LT3=5, HT4=4, LT4=3, HT5=2, LT5=1
        const players = [
            { name: "X_TechnoFlame_X", mode: "Sword", tier: "LT1", sort: 9, cps: 56 },
            { name: "X_TechnoFlame_X", mode: "UHC", tier: "LT1", sort: 9, cps: 56 },
            { name: "X_TechnoFlame_X", mode: "Mace", tier: "LT2", sort: 7, cps: 56 },
            { name: "X_TechnoFlame_X", mode: "Crystal", tier: "HT3", sort: 6, cps: 56 },
            { name: "X_TechnoFlame_X", mode: "Hole", tier: "HT3", sort: 6, cps: 56 },
            { name: "X_TechnoFlame_X", mode: "Bedwars", tier: "HT3", sort: 6, cps: 56 },
            { name: "X_TechnoFlame_X", mode: "Skywars", tier: "HT3", sort: 6, cps: 56 }
        ];

        const modes = ["Sword", "UHC", "Mace", "Crystal", "Hole", "Soup", "Pot", "Skywars", "Bedwars"];
        let currentMode = "Sword";

        function renderTabs() {
            const container = document.getElementById("modeTabs");
            container.innerHTML = "";
            modes.forEach(mode => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${mode === currentMode ? 'active' : ''}`;
                btn.innerText = mode;
                btn.onclick = () => { currentMode = mode; renderTabs(); renderLeaderboard(); };
                container.appendChild(btn);
            });
        }

        function renderLeaderboard() {
            const tbody = document.getElementById("leaderboardBody");
            tbody.innerHTML = "";
            
            // Filter by mode and sort highest tier first
            const filtered = players.filter(p => p.mode === currentMode).sort((a,b) => b.sort - a.sort);
            
            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888; padding: 30px;">No players ranked in this mode yet. Add them to the code database!</td></tr>`;
                return;
            }

            filtered.forEach((player, index) => {
                const isHT = player.tier.startsWith("HT");
                const badgeClass = isHT ? "ht" : "lt";
                const row = `<tr>
                    <td>#${index + 1}</td>
                    <td><strong>${player.name}</strong></td>
                    <td><span class="tier-badge ${badgeClass}">${player.tier}</span></td>
                    <td><span class="cps-val">${player.cps} CPS</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        renderTabs();
        renderLeaderboard();
